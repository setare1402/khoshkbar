
name: Build Khoshkbar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Check required files
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          if [ ! -f "123Gallery.jpg" ]; then
            echo "ERROR: 123Gallery.jpg not found in repository root!"
            exit 1
          fi

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name khoshkbar_takhme_ala --no-pub

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khoshkbar-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
