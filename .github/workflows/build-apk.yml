
name: Build Khoshkbar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name khoshkbar_takhme_ala

      - name: Install dependencies
        run: flutter pub get

      - name: Check app icon image
        run: |
          if [ ! -f "file_00000000104081f484a1e4b2f8765fdf.png" ]; then
            echo "ERROR: App icon image not found!"
            exit 1
          fi

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khoshkbar-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
